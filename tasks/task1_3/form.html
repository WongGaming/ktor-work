<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 1.3</title>
    </head>
    <body>
        <form action="https://www.example.com/submit" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
            
            <label for="pet-select">Choose a pet:</label>
            <select name="pets" id="pet-select">
                <option value="">--Please choose an option--</option>
                <option value="dog">Dog</option>
                <option value="cat">Cat</option>
                <option value="hamster">Hamster</option>
                <option value="parrot">Parrot</option>
                <option value="spider">Spider</option>
            </select><br>
            <br>
            
            <label for ="date">Enter date of birth:</label><br>
            <input type="date" id="date" name="date"><br><br>
            

            <label for="color">Choose a color:</label><br>
            <input type="color" name = "color" id = "color"><br><br>

            <label for="radio">What is your occupation?</label><br>
            <input type="radio" id="student" name="occupation" value="student">
            <label for="student">Student</label><br>
            <input type="radio" id="teacher" name="occupation" value="teacher">
            <label for="teacher">Teacher</label><br>
            <input type="radio" id="engineer" name="occupation" value="engineer">
            <label for="engineer">Engineer</label><br>
            <input type="radio" id="researcher" name="occupation" value="researcher">
            <label for="researcher">Researcher</label><br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
